name: Daily Ad Ops Check

on:
  schedule:
    # Runs at 07:00 UTC every day
    - cron: "0 7 * * *"
  workflow_dispatch: {}  # allows manual trigger from the GitHub Actions tab

jobs:
  daily-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Regenerate synthetic data
        run: python src/generate_data.py

      - name: Run daily check
        run: python src/run_daily_check.py

      - name: Commit updated reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/morning_report.md reports/run_history.log
          git diff --staged --quiet || git commit -m "chore: automated daily check $(date -u +%Y-%m-%d)"
          git push
